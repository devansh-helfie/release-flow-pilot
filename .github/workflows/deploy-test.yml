name: Deploy TEST
run-name: Deploy TEST ${{ inputs.release-tag }}

# Deploys one existing release tag (RC or stable) to TEST and runs QA.
# Workflow and deployment config come from main; the application source comes only from the tag.

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing tag, for example v1.2.0 or v1.2.0-rc.1
        type: string
        required: true

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve tag and check DEV
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and freeze its commit
        id: tag
        env:
          RAW_TAG: ${{ inputs.release-tag }}
        run: |
          TAG=$(echo "$RAW_TAG" | xargs)
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "::error::'$TAG' is not a release tag. Use for example v1.2.0 or v1.2.0-rc.1"
            exit 1
          fi
          SHA=$(git rev-list -n1 "refs/tags/$TAG" 2>/dev/null) \
            || { echo "::error::Tag $TAG does not exist. Tags are created by Deploy DEV after a release PR merge."; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying \`$TAG\` = \`$SHA\` to TEST." >> "$GITHUB_STEP_SUMMARY"

      - name: Require DEV success for this source
        env:
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          LATEST=$(gh run list --workflow deploy-dev.yml --commit "$SHA" --limit 20 \
            --json databaseId,status,conclusion,startedAt --jq 'sort_by(.startedAt) | last // empty')
          [ -n "$LATEST" ] || { echo "::error::No DEV run found for $SHA"; exit 1; }
          jq -e '.status == "completed" and .conclusion == "success"' <<<"$LATEST" >/dev/null \
            || { echo "::error::Latest DEV run for $SHA is not successful: $LATEST"; exit 1; }

  test:
    name: TEST
    needs: resolve
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: write
    with:
      environment: test
      sha: ${{ needs.resolve.outputs.sha }}
      release-tag: ${{ needs.resolve.outputs.tag }}

  qa:
    name: QA
    needs: [resolve, test]
    runs-on: [self-hosted, release-pilot-deploy]
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Checkout QA and config from main
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            qa
            config
          sparse-checkout-cone-mode: false

      - name: Run QA against TEST
        run: |
          set -o pipefail   # keep QA's exit code through tee
          PORT=$(grep '^PORT=' config/test.env | cut -d= -f2)
          STATUS=0
          node qa/qa.mjs "http://localhost:$PORT" "$TAG" "$SHA" | tee qa.log || STATUS=$?
          {
            echo "### QA for \`$TAG\`: $([ "$STATUS" = 0 ] && echo passed || echo FAILED)"
            echo '```'
            cat qa.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

      # Only a passing QA run produces evidence, so Promote PROD can rely on it.
      - name: Write QA evidence
        run: |
          jq -n --arg tag "$TAG" --arg sha "$SHA" --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" --arg qa_demo "$(grep '^QA_DEMO=' config/test.env | cut -d= -f2)" \
            '{tag: $tag, sha: $sha, run_id: $run_id, run_attempt: $run_attempt, workflow_sha: $workflow_sha, qa_demo: $qa_demo}' \
            > qa-evidence.json
          cat qa-evidence.json

      - uses: actions/upload-artifact@v4
        with:
          name: qa-evidence
          path: qa-evidence.json
