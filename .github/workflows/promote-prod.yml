name: Promote PROD
run-name: Promote PROD ${{ inputs.tested-tag }}

# Promotes a tag that passed TEST and QA. An RC gets its stable tag on the same commit;
# a stable tag is reused. PROD always runs a stable identity and waits for human approval.

on:
  workflow_dispatch:
    inputs:
      tested-tag:
        description: Tag that passed Deploy TEST, for example v1.2.0-rc.1 or v1.2.0
        type: string
        required: true

permissions:
  contents: read

jobs:
  gate:
    name: Check TEST and QA
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      version: ${{ steps.tag.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and freeze its commit
        id: tag
        env:
          RAW_TAG: ${{ inputs.tested-tag }}
        run: |
          TAG=$(echo "$RAW_TAG" | xargs)
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "::error::'$TAG' is not a release tag. Use for example v1.2.0 or v1.2.0-rc.1"
            exit 1
          fi
          SHA=$(git rev-list -n1 "refs/tags/$TAG" 2>/dev/null) \
            || { echo "::error::Tag $TAG does not exist."; exit 1; }
          VERSION=${TAG#v}
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION%-rc.*}" >> "$GITHUB_OUTPUT"

      # Keyed by commit, not tag name: v1.2.0-rc.1 and v1.2.0 share a commit, so a newer
      # failed TEST run for either one blocks promotion.
      - name: Require the latest TEST run for this commit to have passed QA
        env:
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          TAGS=$(git tag --points-at "$SHA" | jq -R . | jq -sc .)
          LATEST=$(gh run list --workflow deploy-test.yml --limit 100 --json databaseId,displayTitle,status,conclusion,startedAt \
            | jq -c --argjson tags "$TAGS" '[.[] | select((.displayTitle | sub("^Deploy TEST"; "") | gsub("\\s"; "")) as $t | $tags | index($t))]
                | sort_by(.startedAt) | last // empty')
          [ -n "$LATEST" ] || { echo "::error::No Deploy TEST run found for $SHA (tags $TAGS). Run Deploy TEST first."; exit 1; }
          echo "Latest TEST run for this commit: $LATEST"
          jq -e '.status == "completed" and .conclusion == "success"' <<<"$LATEST" >/dev/null \
            || { echo "::error::The latest Deploy TEST run for $SHA did not pass. Fix and re-run TEST before promoting."; exit 1; }

          RUN_ID=$(jq -r .databaseId <<<"$LATEST")
          gh run download "$RUN_ID" -n qa-evidence -D evidence \
            || { echo "::error::Run $RUN_ID has no QA evidence (older or expired run). Re-run Deploy TEST for this tag."; exit 1; }
          jq -e --arg sha "$SHA" '.sha == $sha' evidence/qa-evidence.json >/dev/null \
            || { echo "::error::QA evidence is for a different commit."; exit 1; }
          {
            echo "### TEST and QA passed for \`$SHA\`"
            echo '```json'
            cat evidence/qa-evidence.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  stable-tag:
    name: Stable tag
    needs: gate
    uses: ./.github/workflows/create-tag.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.gate.outputs.version }}
      channel: stable
      sha: ${{ needs.gate.outputs.sha }}

  # The prod environment requires a reviewer, so this waits for approval.
  prod:
    name: PROD
    needs: [gate, stable-tag]
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: write
    with:
      environment: prod
      sha: ${{ needs.gate.outputs.sha }}
      release-tag: ${{ needs.stable-tag.outputs.tag }}
