name: PR checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  pr-checks:
    name: pr-checks
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|ci|chore|refactor|test)(\(.+\))?!?: .*PLT-1652'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must be a Conventional Commit containing PLT-1652, for example 'feat: add bulk tier PLT-1652'. Got: $TITLE"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: node --test

      - name: Docker build
        run: docker build .
